[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-compactor"
version = "1.0.0"
description = "Offline AI-agent context compression with structured memory and quality metrics"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["jieba==0.42.1", "tiktoken>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
context-compactor = "context_compactor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
